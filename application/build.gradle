plugins {
    id "java-library"
    id "jacoco"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    api project(":domain")
    testImplementation platform("org.junit:junit-bom:${rootProject.junitVersion}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.mockito:mockito-core:${rootProject.mockitoVersion}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

sourceSets {
    qaTest {
        java.srcDir file("src/qaTest/java")
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    qaTestImplementation.extendsFrom testImplementation
    qaTestRuntimeOnly.extendsFrom testRuntimeOnly
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestCoverageVerification
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = "INSTRUCTION"
                value = "COVEREDRATIO"
                minimum = 0.70
            }
        }
    }
}

check {
    dependsOn jacocoTestCoverageVerification
}

tasks.register("qaTest", Test) {
    description = "Runs QA scenario tests for MVP flows."
    group = "verification"
    testClassesDirs = sourceSets.qaTest.output.classesDirs
    classpath = sourceSets.qaTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter test
}
