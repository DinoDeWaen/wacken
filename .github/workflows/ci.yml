name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    name: Test and build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run tests and coverage gates
        run: ./gradlew test

      - name: Run QA suite
        run: ./gradlew qaTest

      - name: Validate supported Android API usage
        run: |
          python3 scripts/tests/test_android_smoke_runner.py
          ./gradlew :app:lintDebug

      - name: Validate immutable test-image acquisition and registry failure handling
        run: python3 scripts/tests/test_test_images.py

      - name: Validate festival creation against PostgreSQL and PostgREST
        run: scripts/verify-festival-creation.sh

      - name: Validate rating isolation, migration and replay against PostgreSQL and PostgREST
        run: bash scripts/verify-rating-state.sh

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wacken-planner-0.1.${{ github.run_number }}-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android-creation:
    name: Android API ${{ matrix.api-level }} UI and Room regressions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [23, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          script: ANDROID_ADB=adb sh scripts/verify-android-smoke.sh emulator-5554 all

      - name: Retain native failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-api-${{ matrix.api-level }}-failure-diagnostics
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
